name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      RUN_PRODUCTION_STACK_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27'
      - run: python -m pip install -e '.[dev,security]'
      - run: pip-audit -r deploy/requirements.lock --no-deps --disable-pip --progress-spinner off
      - run: docker build -t church-roster-bot:phase43-validation .
      - name: Validate Linux shell syntax
        run: >-
          docker run --rm --network none --entrypoint bash
          -v "$PWD:/source:ro" postgres:17-bookworm
          -c 'for script in /source/deploy/*.sh; do bash -n "$script" || exit; done'
      - run: pytest -q tests/test_deployment_stack.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: roster_test
          POSTGRES_USER: roster
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roster -d roster_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://roster:test-only-password@localhost:5432/roster_test
      DATABASE_URL: postgresql+psycopg://roster:test-only-password@localhost:5432/roster_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27'
      - run: python -m pip install -e '.[dev,security]'
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: bandit -r src
      - run: pip-audit --progress-spinner off
      - run: pytest -q
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - name: Validate operations after SQLite import
        run: >-
          pytest -q --migrate-roster-fixtures -m postgres
          tests/test_distribution.py::test_coordinator_can_request_a_preview_in_the_real_router_without_assigning
          tests/test_proposals.py::test_chat_can_save_review_and_cancel_a_draft_after_restart
          tests/test_automation_offers.py
          tests/test_monthly_opening.py::test_opens_at_configured_local_time_and_never_repeats_after_restart
          tests/test_waitlist.py::test_full_slot_waits_then_notifies_first_entry_without_assigning
          tests/test_automatic_replacements.py::test_automatically_invites_and_only_acceptance_replaces_original
          tests/test_reminders.py::test_reminder_at_local_clock_is_utc_and_sent_once_across_restart
          tests/test_emergencies.py::test_opt_in_policy_invites_only_inside_horizon_and_never_assigns_before_accept
          tests/test_reports.py::test_report_includes_zero_load_volunteers_and_does_not_infer_attendance
          tests/test_reports.py::test_other_ministry_participations_are_excluded_and_its_report_is_forbidden
