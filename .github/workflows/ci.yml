name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: roster_test
          POSTGRES_USER: roster
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roster -d roster_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://roster:test-only-password@localhost:5432/roster_test
      DATABASE_URL: postgresql+psycopg://roster:test-only-password@localhost:5432/roster_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27'
      - run: python -m pip install -e '.[dev,security]'
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: bandit -r src
      - run: pip-audit --progress-spinner off
      - run: pytest -q
