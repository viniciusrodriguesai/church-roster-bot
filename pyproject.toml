[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "church-roster-bot"
version = "0.1.0"
description = "Open-source WhatsApp bot for managing church volunteer schedules, ministries, availability, and substitutions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "tzdata>=2024.2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a running PostgreSQL URL in TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
